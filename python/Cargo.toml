[package]
name = "flightlog-py"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Python bindings for flightlog-core"

[lib]
name = "_flightlog"
crate-type = ["cdylib"]

[dependencies]
flightlog-core = { path = "../flightlog-core", version = "0.3.0", features = ["arrow", "facts"] }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
pyo3-arrow = { version = "0.21", default-features = false }
arrow-array = { version = "60.1", default-features = false }
arrow-schema = { version = "60.1", default-features = false }
